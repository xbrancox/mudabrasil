<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Novidades · MeuVoto</title>
  <meta name="description" content="Novidades e atualizações do MeuVoto: veja o histórico de melhorias, novas funcionalidades e correções aplicadas na plataforma.">

<link rel="icon" type="image/svg+xml" href="../icon.svg">
<script src="../config.js"></script>
<script src="../js/site-header.js"></script>
<style>
:root{--bg:#061a3a;--card:#0d2242;--card2:#123059;--line:rgba(127,176,245,.22);--ink:#fff;--muted:#94A3B8;--gold:#FFD700;--green:#2ECC71;--red:#E74C3C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at top right,rgba(17,95,203,.14),transparent 50%),var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Montserrat,sans-serif;font-weight:800;line-height:1.2}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:820px;margin:0 auto;padding:38px 20px 60px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{font-size:clamp(24px,4.5vw,34px)}
.hero p{color:var(--muted);max-width:640px;margin:10px auto 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 22px}
.chip{font:700 12px Manrope;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--muted);cursor:pointer;transition:all .15s}
.chip.on{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.chip:hover{filter:brightness(1.15)}
.entry{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 18px;margin-bottom:12px;transition:border-color .2s}
.entry:hover{border-color:var(--gold)}
.entry-head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.sha{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--gold);padding:3px 8px;background:rgba(255,215,0,.12);border-radius:6px}
.date{font:600 12px/1 Manrope;color:var(--muted);margin-left:auto}
.author{font:500 12px/1 Manrope;color:var(--muted)}
.msg{font:600 15px/1.4 Manrope;margin-bottom:4px}
.body{color:var(--muted);font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.body code{background:var(--card2);padding:1px 5px;border-radius:4px;color:var(--gold);font-size:12.5px}
.tag{display:inline-block;font:700 11px Manrope;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-right:6px}
.tag.feat{background:rgba(46,204,113,.18);color:var(--green)}
.tag.fix{background:rgba(231,76,60,.18);color:var(--red)}
.tag.chore{background:rgba(148,163,184,.2);color:var(--muted)}
.tag.docs{background:rgba(74,144,240,.2);color:var(--blueL,#4a90f0)}
.load{text-align:center;padding:40px;color:var(--muted)}
.err{border:1px solid rgba(231,76,60,.4);background:rgba(231,76,60,.1);color:#ffc9c2;padding:14px;border-radius:12px;text-align:center}
.foot{text-align:center;margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>🆕 Novidades do MeuVoto</h1>
    <p>Acompanhe o que mudou na plataforma, em linguagem simples. Dados lidos diretamente do repositório público no GitHub — sempre atualizados.</p>
  </section>

  <div class="filters" id="filters">
    <button class="chip on" data-k="all">Todas</button>
    <button class="chip" data-k="feat">✨ Novidades</button>
    <button class="chip" data-k="fix">🔧 Correções</button>
    <button class="chip" data-k="docs">📚 Documentação</button>
    <button class="chip" data-k="chore">⚙️ Manutenção</button>
  </div>

  <div id="list" class="load">⏳ Carregando histórico…</div>

  <p class="foot">
    <a href="votacoes.html">← Voltar para Votações</a> ·
    <a href="links.html">Todos os links</a> ·
    <a href="metodologia.html">Metodologia</a>
  </p>
</main>

<script id="ciclo33">
(function(){
  var CACHE_KEY = 'mv_changelog_v1';
  var CACHE_TTL = 60 * 60 * 1000; // 1h
  var REPO = 'xbrancox/votabrasil';
  var list = document.getElementById('list');
  var state = { items: [], filter: 'all' };

  function classify(msg){
    var m = (msg || '').toLowerCase();
    if (/\bfeat\b|\bnovo\b|\badicion/.test(m) || /^feat[\(:]/i.test(msg)) return 'feat';
    if (/\bfix\b|\bcorre/.test(m) || /^fix[\(:]/i.test(msg)) return 'fix';
    if (/\bdocs\b|\bdocument/.test(m) || /^docs[\(:]/i.test(msg)) return 'docs';
    return 'chore';
  }
  function tagHtml(kind){
    var L = {feat:'✨ novidade', fix:'🔧 correção', docs:'📚 docs', chore:'⚙️ manutenção'};
    return '<span class="tag '+kind+'">'+L[kind]+'</span>';
  }
  function fmtDate(iso){
    try { return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return iso; }
  }
  function fmtMsg(s){
    return String(s||'')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function render(){
    if (!state.items.length){ list.className='load'; list.textContent='Nada encontrado.'; return; }
    var f = state.filter;
    var html = '';
    state.items.forEach(function(c){
      var k = c.kind;
      if (f !== 'all' && k !== f) return;
      html += '<article class="entry">'
        + '<div class="entry-head">'
        + '<span class="sha">#'+c.sha.slice(0,7)+'</span>'
        + '<span class="author">@'+c.author+'</span>'
        + '<span class="date">'+fmtDate(c.date)+'</span>'
        + '</div>'
        + '<div class="msg">'+tagHtml(k)+fmtMsg(c.msg.split('\n')[0])+'</div>'
        + (c.body ? '<div class="body">'+fmtMsg(c.body)+'</div>' : '')
        + '</article>';
    });
    if (!html) html = '<p class="load">Nenhum commit nesta categoria.</p>';
    list.className='';
    list.innerHTML = html;
  }

  document.getElementById('filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#filters .chip').forEach(function(c){c.classList.remove('on')});
    b.classList.add('on');
    state.filter = b.getAttribute('data-k');
    render();
    try { history.replaceState(null, '', '#'+state.filter); } catch(e){}
  });

  async function load(){
    // Tenta cache
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw){
        var cached = JSON.parse(raw);
        if (Date.now() - cached.t < CACHE_TTL && Array.isArray(cached.items)){
          state.items = cached.items;
          render();
          // segue buscando em background
        }
      }
    } catch(e){}

    try {
      var url = 'https://api.github.com/repos/'+REPO+'/commits?per_page=30';
      var r = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!r.ok) throw new Error('HTTP '+r.status);
      var data = await r.json();
      state.items = (data || []).map(function(c){
        var msg = (c.commit && c.commit.message) || '';
        var first = msg.split('\n')[0];
        var rest  = msg.split('\n').slice(1).join('\n').trim();
        return {
          sha: c.sha || '',
          author: (c.commit && c.commit.author && c.commit.author.name) || 'desconhecido',
          date: c.commit && c.commit.author && c.commit.author.date,
          msg: first,
          body: rest,
          kind: classify(msg)
        };
      });
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), items: state.items})); } catch(e){}
      render();
    } catch(e) {
      if (state.items.length) {
        // Já tinha cache — apenas avisa
        var warn = document.createElement('p');
        warn.className = 'err';
        warn.style.marginTop = '12px';
        warn.textContent = '⚠️ Não foi possível atualizar agora. Mostrando versão em cache.';
        list.insertAdjacentElement('afterend', warn);
      } else {
        list.className = 'err';
        list.innerHTML = '❌ Não foi possível carregar o histórico agora. Tente novamente em instantes.<br><small>'+String(e.message||'').replace(/</g,'&lt;')+'</small>';
      }
    }
  }

  // Filtro inicial pelo hash
  try {
    var h = location.hash.replace('#','');
    if (['all','feat','fix','docs','chore'].indexOf(h) >= 0){
      state.filter = h;
      document.querySelectorAll('#filters .chip').forEach(function(c){
        c.classList.toggle('on', c.getAttribute('data-k') === h);
      });
    }
  } catch(e){}

  load();
})();
</script>
</body>
</html>
