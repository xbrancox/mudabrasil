<head>

<meta property="og:description" content="Candidatos reais das Eleições Gerais 2026 com número de urna, partido, coligação e situação de julgamento — dados oficiais do TSE.">

<link rel="icon" type="image/x-icon" href="../images/logo/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../images/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/logo/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/logo/favicon-180x180.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

<script src="../config.local.js?v=2"></script>

<style>
:root{--bg:#061a3a;--card:#0d2242;--card2:#123059;--line:rgba(127,176,245,.22);--ink:#fff;--muted:#94A3B8;--gold:#FFD700;--blueL:#4a90f0;--green:#2ECC71;--red:#E74C3C;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,sans-serif;padding:20px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-family:Montserrat;font-weight:900;font-size:26px;margin:8px 0}
.kick{color:var(--gold);font:800 11px Manrope;letter-spacing:.2em;text-transform:uppercase}
.muted{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 13px Manrope;padding:10px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#FFD700,#FFA500);border:none;color:#1a1400}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:500 14px Manrope;width:100%}
.filtros{display:grid;grid-template-columns:2fr 1.4fr .7fr 1.2fr auto;gap:10px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;background:var(--card2);flex:none}
.badge{font:800 10px Manrope;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--green);border-color:rgba(46,204,113,.4)}
.badge.red{color:var(--red);border-color:rgba(231,76,60,.4)}
.badge.amb{color:var(--gold);border-color:rgba(255,215,0,.4)}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0}
.overlay{position:fixed;inset:0;background:rgba(4,8,20,.85);backdrop-filter:blur(5px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px}
.stat small{color:var(--muted);font-size:9.5px;display:block}
.stat b{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.quote{border-left:3px solid var(--blueL);background:rgba(74,144,240,.08);border-radius:6px;padding:5px 9px;margin-top:6px;font-size:12px;color:var(--muted)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#aviso{display:none;background:rgba(255,215,0,.08);border:1px solid var(--gold);border-radius:12px;padding:12px;margin:12px 0;font-size:13px}
@media(max-width:900px){.filtros{grid-template-columns:1fr 1fr}}
</style>
<style>
/* ===== CABEÇALHO PADRÃO MEUVOTO ===== */
header.topo{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;padding:12px 20px;background:#061a3add;backdrop-filter:blur(8px);border-bottom:1px solid #1d3a66;flex-wrap:wrap}
header.topo .lg{display:flex;gap:10px;align-items:center;text-decoration:none}
header.topo .lg .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7ed957,#2ECC71);display:flex;align-items:center;justify-content:center;color:#061a3a;font-size:18px}
header.topo .lg b{font-family:Montserrat;font-size:17px;color:#fff}
header.topo .lg small{display:block;color:#9fb0c8;font-size:11px}
header.topo nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
header.topo nav a{color:#eaf1fb;text-decoration:none;padding:8px 12px;border-radius:999px;font-size:13px}
header.topo nav a:hover{background:#123059}
header.topo nav a.on{background:#FFD700;color:#061a3a;font-weight:800}
@media(max-width:960px){header.topo nav{display:none}}
</style>
  <script src="../js/site-header.js?v=3"></script>
</head>
<body>
<div class="wrap">
<div class="topo">
<div><span class="kick">TSE · DIVULGACAND</span><h1>Eleições 2026 — Candidatos</h1>
<p class="muted">Dados públicos do TSE. Escolha os filtros e clique em <b>Buscar</b> — paginação de 50, nada de carregar 15 mil de uma vez.</p></div>
<a class="btn" href="../index.html">← Voltar</a>
</div>
<div id="aviso"></div>
<div class="filtros">
<input id="q" placeholder="🔎 Nome ou número…"/>
<select id="cargo">
<option value="6">Deputado Federal</option>
<option value="7">Deputado Estadual</option>
<option value="5">Senador</option>
<option value="3">Governador</option>
<option value="1">Presidente</option>
</select>
<select id="uf"></select>
<select id="sit">
<option value="">Todas situações</option>
<option value="DEFERIDO">DEFERIDO</option>
<option value="INDEFERIDO">INDEFERIDO</option>
<option value="AGUARDANDO">AGUARDANDO JULGAMENTO</option>
</select>
<button class="btn gold" onclick="buscar(1)"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
</div>
<div class="muted" id="info">Nenhuma busca ainda — escolha UF + cargo e clique em Buscar.</div>
<div class="grid" id="lista" style="margin-top:12px"></div>
<div class="pager">
<button class="btn sm" id="pgAnt" onclick="buscar(page-1)" disabled>‹ Anterior</button>
<span class="muted" id="pgInfo">—</span>
<button class="btn sm" id="pgProx" onclick="buscar(page+1)" disabled>Próxima ›</button>
</div>
</div>
<div class="overlay" id="mDet"><div class="modal"><div id="detBody"></div><button class="btn" style="width:100%;margin-top:12px" onclick="fechar()">Fechar</button></div></div>
<script>
/* FIX: API_BASE pode ser '' (mesma origem) — não usar ||, que trocaria '' pela URL de produção */
const API=(window.MeuVoto&&typeof window.MeuVoto.API_BASE==='string')?window.MeuVoto.API_BASE:'https://MeuVoto-redesign-production.up.railway.app';
const UFS=['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'];
const $=s=>document.querySelector(s);
$('#uf').innerHTML=UFS.map(u=>`<option value="${u}" ${u==='SP'?'selected':''}>${u}</option>`).join('');
let page=1,total=0,LAST=[],SNAP=null;const PS=50;
function aviso(m){const a=$('#aviso');a.style.display=m?'block':'none';a.innerHTML=m||''}
/* Snapshot commitado (candidatos reais 2026) — fallback quando o backend não responde */
async function buscarEstatico(){
 if(!SNAP){if(location.protocol==='file:')throw new Error('snapshot indisponível em file://');const rs=await fetch('../data/candidatos-2026.json');if(!rs.ok)throw new Error('snapshot HTTP '+rs.status);SNAP=await rs.json();}
 const q=$('#q').value.trim().toLowerCase(),cargo=$('#cargo').value,uf=$('#uf').value,sit=$('#sit').value;
 let lista=SNAP.candidatos||[];
 if(cargo)lista=lista.filter(c=>String(c.cargo)===String(cargo));
 if(uf)lista=lista.filter(c=>c.uf===uf);
 if(sit){const S=sit.toUpperCase();lista=lista.filter(c=>{const v=String(c.situacao||'').toUpperCase();
  if(S==='DEFERIDO')return /DEFERIDO|APTO/.test(v);
  if(S==='AGUARDANDO')return /AGUARDANDO|PENDENTE/.test(v);
  if(S==='INDEFERIDO')return /INDEFERIDO/.test(v);
  return true;});}
 if(q)lista=lista.filter(c=>(c.nomeUrna||'').toLowerCase().includes(q)||String(c.numero||'').includes(q)||(c.partido||'').toLowerCase().includes(q));
 return lista;
}
/* Aplica página + render comum aos dois caminhos (API e snapshot) */
function render(arr){
 LAST=arr;
 $('#info').textContent=`${total} candidato(s) — mostrando ${arr.length} nesta página.`;
 const tp=Math.max(1,Math.ceil(total/PS));
 $('#pgInfo').textContent=`Página ${page} de ${tp}`;
 $('#pgAnt').disabled=page<=1;$('#pgProx').disabled=page>=tp;
 $('#lista').innerHTML=arr.map((c,i)=>card(c,i)).join('')||'<p class="muted">Nada encontrado com esses filtros.</p>';
}
async function buscar(p){
 page=Math.max(1,p);
 const q=$('#q').value.trim(),cargo=$('#cargo').value,uf=$('#uf').value,sit=$('#sit').value;
 $('#info').textContent='Carregando…';$('#lista').innerHTML='';
 const url=`${API}/api/candidatos-tse?cargo=${cargo}&uf=${uf}&page=${page}&pageSize=${PS}`+(sit?`&situacao=${encodeURIComponent(sit)}`:'')+(q?`&q=${encodeURIComponent(q)}`:'');
 try{
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  let arr;
  if(Array.isArray(j)){arr=j;total=arr.length;const s=(page-1)*PS;arr=arr.slice(s,s+PS);}
  else{arr=j.candidatos||j.dados||[];total=j.total!=null?j.total:arr.length;}
  aviso('');
  render(arr);
 }catch(e){
  /* Backend dormindo/indisponível → snapshot local (nunca fica em branco) */
  try{
   const all=await buscarEstatico();
   total=all.length;
   const arr=all.slice((page-1)*PS,page*PS);
   const qtd=(SNAP.candidatos||[]).length;
   aviso(`📦 <b>Modo snapshot:</b> backend indisponível (${e.message}) — exibindo ${qtd} candidatos reais do TSE extraídos em ${SNAP.extraidoEm?new Date(SNAP.extraidoEm).toLocaleString('pt-BR'):'—'}. A situação de julgamento muda — ao voltar, o backend mostra os dados ao vivo.`);
   render(arr);
  }catch(e2){
   $('#info').textContent='';
   aviso(`⚠️ Não foi possível falar com o backend (${e.message}) nem carregar o snapshot local (${e2.message}).`);
   $('#lista').innerHTML='';
  }
 }
}
const NOME_CARGO={'1':'Presidente','3':'Governador','5':'Senador','6':'Deputado Federal','7':'Deputado Estadual','9':'Vice-Presidente','11':'Suplente de Senador','12':'1º Suplente de Senador','13':'2º Suplente de Senador','14':'Delegado'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function brl(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})}
function card(c,i){
 const sit=(c.situacao||'').toUpperCase();
 const cls=sit.includes('INDEF')?'red':(sit.includes('DEFERIDO')?'ok':'amb');
 return `<div class="card" onclick="abrirIdx(${i})" style="cursor:pointer;transition:transform 0.15s ease">
 <div style="display:flex;gap:12px;align-items:center">${c.foto?`<img class="av" src="${c.foto}" alt="" style="width:50px;height:50px;border-radius:12px;object-fit:cover">`:`<div class="av" style="width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#1a1400;background:var(--gold)">${(c.nomeUrna||c.nomeCivil||'?')[0]}</div>`}
 <div style="flex:1"><b style="font-size:14.5px">${c.nomeUrna||c.nomeCivil||'—'}</b><div class="muted" style="margin-top:2px">${c.numero||''} · <b>${c.partido||''}</b> · ${c.uf||''}${c.idade?' · '+c.idade+' anos':''}${c.ocupacao?' · '+esc(c.ocupacao):''}</div>
 <div style="display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap">
 <span class="badge ${cls}" style="display:inline-block">${c.situacao||'—'}</span>
 <span style="font-size:12px;font-weight:700;color:var(--green,#2ECC71)">💰 Fundo: ${c.fundoEleitoralRecebido?brl(c.fundoEleitoralRecebido):'Não declarado'}</span>
 </div></div></div></div>`;
}
function abrirIdx(i){abrir(LAST[i])}
function abrir(c){
 const bens=c.bens||[];
 $('#detBody').innerHTML=`<h3 style="margin-bottom:6px;font-size:18px">${esc(c.nomeUrna||c.nomeCivil||'')}</h3>
 <div class="muted" style="margin-bottom:12px">${esc(c.nomeCivil||'')} · Número: <b>${c.numero||'—'}</b> · Partido: <b>${esc(c.partido||'')}</b> · UF: <b>${c.uf||''}</b> · Cargo: <b>${esc(NOME_CARGO[c.cargo]||c.cargo||'')}</b>${c.idade?' · Idade: '+c.idade+' anos':''}</div>
 <div class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Situação TSE ${createTooltip('Status do candidato na Justiça Eleitoral: DEFERIDO (aceito), INDEFERIDO (rejeitado) ou AGUARDANDO JULGAMENTO.')}</small><b style="color:${(c.situacao||'').toUpperCase().includes('DEF')?'var(--green)':'var(--gold)'}">${esc(c.situacao||'—')}</b></div>
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Fundo Eleitoral (FEFC) ${createTooltip('Fundo Especial de Financiamento de Campanha. Valor total recebido pelo candidato, regulamentado pela Justiça Eleitoral.')}</small><b style="color:var(--green);font-size:15px">${c.fundoEleitoralRecebido?brl(c.fundoEleitoralRecebido):'Não declarado'}</b></div>
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Ocupação</small><b>${c.ocupacao?esc(c.ocupacao):'Não informada'}</b></div>
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Escolaridade</small><b>${c.escolaridade?esc(c.escolaridade):'—'}</b></div>
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Bens Declarados ${createTooltip('Bens declarados à Justiça Eleitoral no momento da candidatura. Valor total declarado.')}</small><b>${bens.length} (Total: ${c.bensTotal?'R$ '+Number(c.bensTotal).toLocaleString('pt-BR'):'R$ 0'})</b></div>
 <div class="stat" style="background:var(--card2);padding:10px;border-radius:10px"><small style="color:var(--muted);display:block">Fonte Oficial</small><b>DivulgaCand / TSE</b></div>
 </div>
 <p class="muted" style="font-size:12.5px;margin-bottom:14px;line-height:1.5">📊 <b>Transparência Eleitoral 2026:</b> O Fundo Especial de Financiamento de Campanha (FEFC) é regulamentado pela Justiça Eleitoral. Dados públicos extraídos diretamente dos portais do TSE e integrados unificadamente no MeuVoto.</p>
 <h4 style="font-size:14px;color:var(--gold);margin-bottom:8px">🏛️ Detalhes de Bens Declarados (${bens.length})</h4>
 <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
 ${bens.length?bens.map(b=>`<div style="background:var(--card2);padding:8px 12px;border-radius:8px;font-size:12.5px">${esc(b.descricao||b.tipo||'Bem')} — <b style="color:var(--gold)">R$ ${Number(b.valor||0).toLocaleString('pt-BR')}</b></div>`).join(''):renderEmptyState('fa-solid fa-file-invoice-dollar','Nenhum bem declarado à Justiça Eleitoral.')}
 </div>`;
 $('#mDet').classList.add('open');
}
function fechar(){$('#mDet').classList.remove('open')}
</script>
<script id="vb-ele-fix">
(function(){
  if(document.getElementById('vb-ele-fix-run'))return;
  var mk=document.createElement('i');mk.id='vb-ele-fix-run';mk.style.display='none';document.documentElement.appendChild(mk);
  var _fetch=window.fetch;
  window.fetch=function(u,o){
    var p=_fetch.apply(this,arguments);
    try{
      if(typeof u==='string' && u.indexOf('/api/candidatos-tse')>-1){
        return p.then(function(r){return r.json().then(function(j){
          if(j&&j.candidatos&&j.candidatos.sort){j.candidatos.sort(function(a,b){return String(a.nomeUrna||'').localeCompare(String(b.nomeUrna||''),'pt-BR',{numeric:true});});}
          return new Response(JSON.stringify(j),{status:r.status,headers:{'Content-Type':'application/json'}});
        });});
      }
    }catch(e){}
    return p;
  };
  function selUF(){return [].slice.call(document.querySelectorAll('select')).filter(function(s){return [].slice.call(s.options).some(function(o){return o.text.trim()==='DF'||o.value==='DF';});})[0];}
  function selCargo(){return [].slice.call(document.querySelectorAll('select')).filter(function(s){return [].slice.call(s.options).some(function(o){return /Deputado Estadual|Deputado Distrital/.test(o.text);});})[0];}
  function sync(){
    var uf=selUF(),cg=selCargo();if(!uf||!cg)return;
    var op=[].slice.call(cg.options).filter(function(o){return /Deputado Estadual|Deputado Distrital/.test(o.text);})[0];
    if(!op)return;
    if(uf.value==='DF'){op.text='Deputado Distrital (DF)';op.value='8';}
    else{op.text='Deputado Estadual';op.value='7';}
  }
  document.addEventListener('change',sync);
  window.addEventListener('DOMContentLoaded',function(){
    var inp=[].slice.call(document.querySelectorAll('input')).filter(function(i){return (i.placeholder||'').indexOf('Nome')>-1;})[0];
    if(inp)inp.value='';
    sync();
    setTimeout(function(){var b=[].slice.call(document.querySelectorAll('button')).filter(function(x){return /Buscar/i.test(x.textContent);})[0];if(b)b.click();},400);
  });
})();
</script>
</body>
</html>
