<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>API Publica · MeuVoto</title><link rel="icon" type="image/svg+xml" href="../icon.svg"><script src="../config.js"></script><script src="../js/site-header.js"></script><style>:root{--bg:#061a3a;--card:#0d2242;--card2:#123059;--line:rgba(127,176,245,.22);--ink:#fff;--muted:#94A3B8;--gold:#FFD700;--green:#2ECC71}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,sans-serif}h1,h3{font-family:Montserrat,sans-serif}.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}.muted{color:var(--muted);font-size:12.5px}code{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--gold)}.ecard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);font-size:13px;line-height:1.6;margin-top:10px}.btn{border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 13px Manrope;padding:8px 14px;cursor:pointer}.vb{font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(46,204,113,.15);color:var(--green)}.hero{text-align:center;padding:38px 20px 10px}</style></head><body><main><section class="hero"><h1 id="apiPub">API Publica para Jornalistas e Devs</h1><p class="muted">Endpoints abertos. Teste ao vivo, copie a URL e cite a fonte.</p></section><div class="wrap"><div class="ecard"><h3>Como citar</h3><p>Dados: MeuVoto (agregados civicos) + Camara/Senado (dados abertos oficiais). Votos do Termometro sao manifestacoes anonimas, sem valor legal.</p><p class="muted">Uso justo ~1 consulta/s por IP. Sem chave.</p></div><div id="eps"></div></div></main><script>var BASE=(function(){try{if(window.MeuVoto&&MeuVoto.API_BASE)return MeuVoto.API_BASE}catch(e){}try{if(window.VotaBrasil&&VotaBrasil.API_BASE)return VotaBrasil.API_BASE}catch(e){}return 'https://mudabrasil-production-79eb.up.railway.app'})();var EPS=[['GET','/api/health','Status do servico.',''],['GET','/api/candidatos','594 parlamentares reais.','?busca=favacho'],['GET','/api/senadores','81 senadores.',''],['GET','/api/termometro','Indice de confianca ao vivo.',''],['GET','/api/rankings','Reclamados/apoiados/que respondem.',''],['GET','/api/reclamacoes/public','Reclamacoes e apoios publicos.','?politicianId=camara-204379'],['GET','/api/camara/votacoes','Proxy Camara: votacoes do Plenario.','?itens=20&ordem=DESC'],['GET','/api/camara/votacoes/2634392-23/votos','Votos nominais de uma votacao.',''],['GET','/api/stream','Tempo real via SSE.',''],['GET','/api/verificacao/dominios','Dominios p/ selo de verificacao.','']];function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}document.getElementById('eps').innerHTML=EPS.map(function(e,i){return '<div class="ecard"><h3><span class="vb">'+e[0]+'</span> <code>'+e[1]+'</code></h3><p style="margin-top:6px">'+e[2]+'</p>'+(e[3]?'<p class="muted">Ex.: <code>'+e[3]+'</code></p>':'')+'<div style="margin-top:8px"><button class="btn" onclick="testar('+i+')">Testar ao vivo</button> <button class="btn" onclick="copiar('+i+')">Copiar URL</button></div><pre id="r'+i+'" style="display:none;white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font:11.5px/1.5 monospace;margin-top:8px;max-height:220px;overflow:auto"></pre></div>'}).join('');async function testar(i){var p=document.getElementById('r'+i);p.style.display='block';p.textContent='consultando...';try{var r=await fetch(BASE+EPS[i][1]+EPS[i][3]);var t=await r.text();p.textContent='HTTP '+r.status+'\n'+t.slice(0,900)}catch(e){p.textContent='erro: '+e.message}}function copiar(i){var u=BASE+EPS[i][1]+EPS[i][3];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){alert('copiado: '+u)})}else{prompt('Copie:',u)}}</script></body></html>
