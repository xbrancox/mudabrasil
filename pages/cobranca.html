<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cobrança Cívica · MeuVoto</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#061a3a;--card:#0d2242;--card2:#123059;--line:rgba(127,176,245,.22);--ink:#fff;--muted:#94A3B8;--gold:#FFD700;--green:#2ECC71;--red:#E74C3C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at top right,rgba(17,95,203,.14),transparent 50%),var(--bg);color:var(--ink);font:15px/1.5 Manrope,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Montserrat,sans-serif;font-weight:800;line-height:1.2}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:38px 20px 60px}
.muted{color:var(--muted);font-size:12.5px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px;margin-top:14px}
.hero{text-align:center}
.hero h1{font-size:clamp(24px,4.5vw,34px)}
.hero p{color:var(--muted);max-width:620px;margin:10px auto 0}
.badge{font:800 11px Manrope;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-block;margin-bottom:10px}
.badge.gerada{color:var(--gold);border-color:rgba(255,215,0,.45)}
.badge.aberta{color:#4a90f0;border-color:rgba(74,144,240,.45)}
.badge.respondida{color:var(--green);border-color:rgba(46,204,113,.45)}
.info{font-size:14px;line-height:1.7}
.info b{color:var(--gold)}
.vot{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.vot .data{color:var(--muted);font-size:11px}
.resposta{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.35);border-radius:12px;padding:14px;margin-top:14px}
.resposta h3{font-size:14px;color:var(--green);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 14px Manrope;padding:10px 18px;cursor:pointer;margin-top:10px}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(135deg,#FFD700,#FFA500);border:none;color:#1a1400}
.foot{text-align:center;margin-top:22px}
code{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:11px;color:var(--gold)}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>🧾 Cobrança Cívica</h1>
    <p>Este é um registro público de cobrança enviado a um gabinete parlamentar via MeuVoto.</p>
  </section>

  <div class="card" id="cobranca">
    <p class="muted" style="text-align:center">⏳ Carregando cobrança…</p>
  </div>

  <p class="foot"><a href="votacoes.html">← Voltar para as Votações</a></p>
</main>
<script>
const BASE=(function(){try{if(window.MeuVoto&&MeuVoto.API_BASE)return MeuVoto.API_BASE}catch(e){}try{if(window.VotaBrasil&&VotaBrasil.API_BASE)return VotaBrasil.API_BASE}catch(e){}return 'https://mudabrasil-production-79eb.up.railway.app'})();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtData(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return'—'}}
function statusBadge(s){const cls={'gerada':'gerada','aberta':'aberta','respondida':'respondida','enviada':'aberta'}[s]||'';const txt={'gerada':'Gerada','aberta':'Aberta','respondida':'Respondida','enviada':'Enviada'}[s]||s;return '<span class="badge '+cls+'">'+txt+'</span>'}
async function load(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const token=params.get('token');
  if(!id||!token){$('#cobranca').innerHTML='<p class="muted">ID ou token não fornecido.</p>';return}
  try{
    const r=await fetch(BASE+'/api/cobrancas/'+id+'?token='+token);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok||!j.cobranca){$('#cobranca').innerHTML='<p class="muted">Cobrança não encontrada.</p>';return}
    const c=j.cobranca;
    let h=statusBadge(c.status);
    h+='<h2 style="margin-top:10px">Para: <b>'+esc(c.politicianNome)+'</b></h2>';
    h+='<div class="info" style="margin-top:14px">';
    h+='<p><b>Promessa cobrada:</b> '+esc(c.promessa)+'</p>';
    if(c.votacoes&&c.votacoes.length){
      h+='<p style="margin-top:10px"><b>Votações citadas:</b></p>';
      c.votacoes.forEach(function(v){
        h+='<div class="vot"><div class="data">'+fmtData(v.data)+'</div>'+esc(v.assunto)+(v.voto?' · <b>Voto: '+esc(v.voto)+'</b>':'')+'</div>';
      });
    }else{
      h+='<p class="muted" style="margin-top:10px">Nenhuma votação específica citada.</p>';
    }
    h+='</div>';
    if(c.resposta&&c.resposta.texto){
      h+='<div class="resposta"><h3>✅ Resposta oficial do gabinete</h3><p style="margin-top:6px">'+esc(c.resposta.texto)+'</p><p class="muted" style="margin-top:8px">Respondido por '+esc(c.resposta.autor||'Gabinete')+' em '+fmtData(c.respondidaEm)+'</p></div>';
    }else{
      h+='<div class="card" style="background:rgba(255,215,0,.05);border-color:rgba(255,215,0,.3)"><p class="muted">⏳ Aguardando resposta oficial do gabinete.</p></div>';
    }
    if(c.autorizadoParaResponder){
      h+='<a class="btn gold" href="cobranca-responder.html?id='+esc(c.id)+'&token='+esc(token)+'">📝 Responder oficialmente</a>';
    }
    h+='<p class="muted" style="margin-top:14px">Gerado em '+fmtData(c.criadaEm)+' · ID: <code>'+esc(c.id)+'</code></p>';
    $('#cobranca').innerHTML=h;
  }catch(e){
    $('#cobranca').innerHTML='<p class="muted">Erro ao carregar: '+esc(e.message)+'</p>';
  }
}
load();
</script>
</body>
</html>
