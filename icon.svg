<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#115FCB"/>
      <stop offset="100%" style="stop-color:#0E1726"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Dark circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  
  <!-- Logo image (smartphone + check mark) -->
  <image href="icon.png" x="56" y="56" width="400" height="400" filter="url(#shadow)"/>
</svg>