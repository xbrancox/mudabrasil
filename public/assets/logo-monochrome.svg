<?xml version="1.0" encoding="UTF-8"?>
<!-- MeuVoto Monochrome (grayscale) variant -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>MeuVoto - Monochrome</title>
  <defs>
    <filter id="grayscale">
      <feColorMatrix type="matrix"
        values="0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0    0    0    1 0"/>
    </filter>
  </defs>
  <image xlink:href="logo-master.svg" width="512" height="512"
         preserveAspectRatio="xMidYMid meet" filter="url(#grayscale)"/>
</svg>
