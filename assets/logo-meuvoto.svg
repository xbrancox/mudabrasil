<?xml version="1.0" encoding="UTF-8"?>
<!-- MeuVoto Horizontal Logo - master icon + wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 240" width="800" height="240">
  <title>MeuVoto</title>
  <defs>
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115FCB"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
  </defs>

  <!-- Ícone do master (alta resolução) -->
  <image xlink:href="logo-master.svg" x="0" y="0" width="240" height="240" preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark "MeuVoto" -->
  <g transform="translate(270, 0)">
    <text x="0" y="145"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-size="100"
          font-weight="800"
          letter-spacing="-2"
          fill="url(#mvGrad)">Meu<tspan fill="#F59E0B">Voto</tspan></text>
    <text x="4" y="190"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-size="22"
          font-weight="500"
          letter-spacing="6"
          fill="#64748B">VOTO CONTÍNUO E REVOGÁVEL</text>
  </g>
</svg>
