<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" width="800" height="256">
  <!-- Full wordmark logo: icon + "MeuVoto" text -->
  
  <defs>
    <linearGradient id="wordGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Icon circle -->
  <circle cx="128" cy="128" r="120" fill="#1a1a2e"/>
  
  <!-- Checkmark/V in icon -->
  <path d="M 68 90 L 128 180 L 188 90" 
        stroke="url(#wordGold)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Citizen head in icon -->
  <circle cx="128" cy="80" r="20" fill="url(#wordGold)"/>
  
  <!-- "MeuVoto" text -->
  <text x="280" y="156" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="96" 
        font-weight="bold" 
        fill="#1a1a2e">
    Meu<tspan fill="url(#wordGold)">Voto</tspan>
  </text>
</svg>
