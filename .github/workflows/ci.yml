name: CI MeuVoto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'
      - name: Instalar jsdom (dependencia de teste)
        run: npm install --no-save --no-audit --no-fund jsdom
      - name: Auditoria estatica (validar-ia.js)
        run: node scripts/validar-ia.js
      - name: Testes DOM A-L (testar-ia.js)
        run: node scripts/testar-ia.js
      - name: Testes P2/P3/P5 (testar-ciclo23.js)
        run: node scripts/testar-ciclo23.js
      - name: Testes E2E digest (testar-digest-e2e.js)
        run: node scripts/testar-digest-e2e.js
      - name: Testes E2E cobrancas (testar-cobrancas-e2e.js)
        run: node scripts/testar-cobrancas-e2e.js
      - name: Testes ciclo 29 - temas e modo cidadao (testar-ciclo29.js)
        run: node scripts/testar-ciclo29.js
      - name: Testes ciclo 31 - hub links + Open Graph tags (testar-ciclo31.js)
        run: node scripts/testar-ciclo31.js
      - name: Testes ciclo 32 - link checker interno (testar-links.js)
        run: node scripts/testar-links.js
      - name: Testes ciclo 33 - push, changelog, performance, ciclo14 (testar-ciclo33.js)
        run: node scripts/testar-ciclo33.js
      - name: Testes ciclo 34 - VAPID dinâmico + jsPDF (testar-ciclo34.js)
        run: node scripts/testar-ciclo34.js
      - name: Testes ciclo 35 - web-push + fichaPdf jsPDF (testar-ciclo35.js)
        run: node scripts/testar-ciclo35.js
      - name: Testes de acessibilidade (testar-acessibilidade.js)
        run: node scripts/testar-acessibilidade.js
      - name: Testes de SEO (testar-seo.js)
        run: node scripts/testar-seo.js
      - name: Testes de PWA (testar-pwa.js)
        run: node scripts/testar-pwa.js
      - name: Testes de performance (testar-performance.js)
        run: node scripts/testar-performance.js
      - name: Sintaxe do servidor
        run: node --check server/index.js
      - name: Sintaxe do worker digest
        run: node --check scripts/digest-send.js
