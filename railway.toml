# Railway Configuration for VotaBrasil Backend
# Docs: https://docs.railway.app/develop/railway-toml
#
# Fase 3: build via Dockerfile (Node 22-alpine com node:sqlite nativo).
# O servidor serve tanto a API quanto as páginas estáticas do projeto.
# Persistência real do SQLite garantida via volume dedicado.

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Otimizações de deploy
healthcheckRetries = 3
sleepTimeout = 300

[env]
PORT = "8080"
NODE_ENV = "production"
MB_REFRESH_HOURS = "24"
MB_STORAGE = "sqlite"
# Caminho interno do contêiner para o banco de dados SQLite.
# O Railway monta um volume persistente em /data no container.
DB_PATH = "/data/votos.db"
