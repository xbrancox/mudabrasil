<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115FCB"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo navy -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Anel dourado -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.6"/>
  
  <!-- Letra M estilizada em dourado (grande, clara, legível) -->
  <text x="256" y="320" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="280" fill="#FFD700">M</text>
  
  <!-- Checkmark verde abaixo do M (símbolo de voto confirmado) -->
  <path d="M180 380 L230 420 L340 310" stroke="#2ECC71" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
