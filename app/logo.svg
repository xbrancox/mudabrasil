<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="appGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="appNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#appNavy)"/>
  
  <!-- Stylized "V" mark -->
  <path d="M 280 360 L 512 720 L 744 360" 
        stroke="url(#appGold)" 
        stroke-width="72" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Citizen dot -->
  <circle cx="512" cy="320" r="64" fill="url(#appGold)"/>
  
  <!-- Accent lines -->
  <path d="M 460 320 L 440 280" 
        stroke="url(#appGold)" 
        stroke-width="24" 
        stroke-linecap="round"/>
  <path d="M 564 320 L 584 280" 
        stroke="url(#appGold)" 
        stroke-width="24" 
        stroke-linecap="round"/>
</svg>
