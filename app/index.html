<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a3a">
<title>VotaBrasil - Urna Digital</title>
<link rel="manifest" href="manifest.webmanifest?v=14">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="../config.js?v=14"></script>
<link rel="stylesheet" href="app.css?v=14">
</head><body>
<div id="app"></div>
<div id="modal" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script>
/* Limpeza agressiva de SW antigos - garante app fresco */
(function(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){
        if(!r.active || r.active.scriptURL.indexOf('vb-app-v14')<0){
          r.unregister().then(function(){location.reload()});
        }
      });
    });
  }
})();
</script>
<script src="app.js?v=14"></script>
</body></html>
